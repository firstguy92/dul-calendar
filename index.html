<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F6F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="둘의 달력">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" id="mf" href="manifest.json">
<script>try{var _t=(JSON.parse(localStorage.getItem('dul-cycle:v1')||'{}').settings||{}).theme;if(_t&&_t!=='coral')document.getElementById('mf').href='manifest-'+_t+'.json'}catch(e){}</script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>둘의 달력</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F6F6F4;--surface:#FFFFFF;--surface2:#F1F1EE;--ink:#1D1D1F;--muted:#8B8B90;--line:#EDEDEA;
  --period:#EE6A44;--period-ink:#FFFFFF;--period-soft:#FDE4DD;--period-soft-ink:#C6462A;
  --fertile:#E2F4DF;--fertile-ink:#2E8540;--ov:#46B058;--ov-ink:#FFFFFF;
  --point:#6A4FA0;--point-soft:#EEE8F7;--mood:#E5AE3C;
  --warn:#B25F0E;--warn-soft:#FDF0DF;--ok:#2A7A55;--ok-soft:#E3F3E9;
  --btn:#1D1D1F;--btn-ink:#FFFFFF;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121214;--surface:#1C1C1F;--surface2:#27272B;--ink:#F2F2F4;--muted:#9A9AA0;--line:#2C2C30;
    --period:#F07A57;--period-ink:#1A0D08;--period-soft:#3D241C;--period-soft-ink:#F6A68D;
    --fertile:#1E3321;--fertile-ink:#8FD49A;--ov:#5CC46D;--ov-ink:#0E1F11;
    --point:#B9A2E6;--point-soft:#2D2640;--mood:#E9BD5B;
    --warn:#F0B26B;--warn-soft:#3A2A17;--ok:#7FD1A6;--ok-soft:#1A3326;
    --btn:#F2F2F4;--btn-ink:#121214;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121214;--surface:#1C1C1F;--surface2:#27272B;--ink:#F2F2F4;--muted:#9A9AA0;--line:#2C2C30;
  --period:#F07A57;--period-ink:#1A0D08;--period-soft:#3D241C;--period-soft-ink:#F6A68D;
  --fertile:#1E3321;--fertile-ink:#8FD49A;--ov:#5CC46D;--ov-ink:#0E1F11;
  --point:#B9A2E6;--point-soft:#2D2640;--mood:#E9BD5B;
  --warn:#F0B26B;--warn-soft:#3A2A17;--ok:#7FD1A6;--ok-soft:#1A3326;
  --btn:#F2F2F4;--btn-ink:#121214;color-scheme:dark;
}

/* color themes */
:root[data-palette="rose"]{--bg:#FAF6F7;--surface2:#F4EEF0;--line:#F0E8EB;--period:#E0567D;--period-soft:#FBE2EA;--period-soft-ink:#B42F58;--point:#3F6FB5;--point-soft:#E5EDF8}
:root[data-palette="lavender"]{--bg:#F6F5FA;--surface2:#EFEDF6;--line:#EAE7F2;--period:#D2649A;--period-soft:#F9E3EE;--period-soft-ink:#A83D73;--point:#7A5CD6;--point-soft:#EEE9FB}
:root[data-palette="ocean"]{--bg:#F4F7F9;--surface2:#EDF1F4;--line:#E5EBEF;--period:#E8705A;--period-soft:#FCE5DF;--period-soft-ink:#BD4A33;--point:#2F7FD0;--point-soft:#E3EEFA}
@media (prefers-color-scheme:dark){
  :root[data-palette="rose"]:not([data-theme="light"]){--bg:#141113;--surface:#1E1A1C;--surface2:#2A2427;--line:#322B2E;--period:#EE6F95;--period-soft:#43212C;--period-soft-ink:#F5A6BE;--point:#93B4E8;--point-soft:#1F2B3D}
  :root[data-palette="lavender"]:not([data-theme="light"]){--bg:#131219;--surface:#1C1B24;--surface2:#282633;--line:#2E2C3A;--period:#E57DAF;--period-soft:#40213A;--period-soft-ink:#F2A9CB;--point:#B6A2F2;--point-soft:#2B2645}
  :root[data-palette="ocean"]:not([data-theme="light"]){--bg:#10141A;--surface:#19202A;--surface2:#232C38;--line:#2A3441;--period:#F0846E;--period-soft:#3D2520;--period-soft-ink:#F7AE9E;--point:#7DB4F0;--point-soft:#1C2C40}
}
:root[data-palette="rose"][data-theme="dark"]{--bg:#141113;--surface:#1E1A1C;--surface2:#2A2427;--line:#322B2E;--period:#EE6F95;--period-soft:#43212C;--period-soft-ink:#F5A6BE;--point:#93B4E8;--point-soft:#1F2B3D}
:root[data-palette="lavender"][data-theme="dark"]{--bg:#131219;--surface:#1C1B24;--surface2:#282633;--line:#2E2C3A;--period:#E57DAF;--period-soft:#40213A;--period-soft-ink:#F2A9CB;--point:#B6A2F2;--point-soft:#2B2645}
:root[data-palette="ocean"][data-theme="dark"]{--bg:#10141A;--surface:#19202A;--surface2:#232C38;--line:#2A3441;--period:#F0846E;--period-soft:#3D2520;--period-soft-ink:#F7AE9E;--point:#7DB4F0;--point-soft:#1C2C40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
svg{font-family:inherit}
.serif{font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--point);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 112px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 16px 12px;max-width:520px;margin:0 auto}
header.top h1{margin:0;font-size:24px;font-weight:800;flex:1;letter-spacing:-.03em}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:14px;color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.iconbtn{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:22px;height:22px}

/* cards & text */
.card{background:var(--surface);border-radius:20px;padding:20px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:18px;font-weight:700;line-height:1.35}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.headline{margin:0 0 6px;font-size:22px;font-weight:800;line-height:1.38;letter-spacing:-.02em}
.headline.sm{font-size:19px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 12px}
.sechead h3{margin:0;font-size:19px;font-weight:800}
.link{border:0;background:transparent;color:var(--muted);font-size:14.5px;padding:4px 0}
.empty{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.note{font-size:13px;color:var(--muted);margin:8px 4px 0}

/* buttons */
.btn{border:0;border-radius:14px;padding:13px 16px;font-size:15.5px;background:var(--btn);color:var(--btn-ink);font-weight:700}
.btn.ghost{background:var(--surface2);color:var(--ink);font-weight:600}
.btn.tint{background:var(--period-soft);color:var(--period-soft-ink)}
.btn.danger{background:transparent;color:var(--period);border:1px solid var(--period);font-weight:600}
.btn.full{width:100%}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}

/* home status */
.notice{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.notice .bell{flex:none;width:38px;height:38px;border-radius:11px;background:var(--period-soft);color:var(--period-soft-ink);display:flex;align-items:center;justify-content:center}
.notice small{display:block;color:var(--muted);font-size:13px}
.notice b{font-size:15px;font-weight:600}
.sthead{display:flex;align-items:center;gap:14px}
.dbox{flex:none;width:46px;height:46px;border-radius:13px;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.sthead .big{display:block;font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.25}
.sthead .small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.cbar{margin:22px 0 0}
.track{position:relative;height:8px;border-radius:4px;background:var(--surface2)}
.track .seg{position:absolute;top:0;bottom:0;border-radius:5px}
.track .seg.p{background:var(--period)}
.track .seg.f{background:var(--fertile)}
.track .seg.o{background:var(--ov)}
.track .now{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--surface);border:4px solid var(--btn)}
.cbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);margin-top:20px}
.wd{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0}
.wd .w{font-size:12.5px;color:var(--muted)}
.wd .num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-variant-numeric:tabular-nums}
.wd.today .num{background:var(--btn);color:var(--btn-ink);font-weight:700}
.wd .ln{height:4px;width:60%;border-radius:2px}
.ln.period{background:var(--period)}.ln.pred{background:var(--period-soft)}.ln.fertile{background:var(--fertile)}.ln.ov{background:var(--ov)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:0 4px 4px;margin:0 -4px 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:0;background:var(--surface);border-radius:999px;padding:10px 15px;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.pill span{width:18px;height:18px;border-radius:50%;background:var(--surface2);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.pill.main{background:var(--btn);color:var(--btn-ink)}
.recs{display:grid;gap:14px}
.rec{display:flex;gap:12px;align-items:flex-start}
.rdot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.rec small{display:block;font-size:13px;color:var(--muted)}
.rec b{font-size:15.5px;font-weight:600;word-break:break-word}
.tip{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.tip:first-of-type{border-top:0;padding-top:2px}
.tip .em{font-size:20px;line-height:1.3;flex:none;width:26px;text-align:center}

/* calendar */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.monthbar b{font-size:20px;font-weight:800}
.navbtns{display:flex;gap:4px}
.navbtns button{border:0;background:var(--surface);border-radius:12px;min-width:40px;height:36px;padding:0 12px;font-size:14.5px}
.cal{background:var(--surface);border-radius:22px;padding:6px 0 0;overflow:hidden}
.wkh{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 0 6px}
.wkh span{text-align:center;font-size:12.5px;color:var(--muted)}
.wrow{border-top:1px solid var(--line)}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.day{border:0;background:transparent;padding:8px 0 2px;display:flex;flex-direction:column;align-items:center;gap:4px}
.day.sel{background:var(--surface2)}
.day .num{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-variant-numeric:tabular-nums}
.day.today .num{background:var(--btn);color:var(--btn-ink);font-weight:700}
.day.out .num{color:var(--muted);opacity:.55}
.marks{display:flex;gap:3px;height:7px;align-items:center}
.marks i{width:6px;height:6px;border-radius:50%;display:block}
.bars{display:grid;grid-template-columns:repeat(7,1fr);height:26px;align-items:center;padding-bottom:6px}
.bars.sel1,.bars.sel2,.bars.sel3,.bars.sel4,.bars.sel5,.bars.sel6,.bars.sel7{background-repeat:no-repeat}
.bar{grid-row:1;height:18px;font-size:11px;font-weight:700;line-height:18px;padding:0 7px;white-space:nowrap;overflow:hidden}
.bar.period{background:var(--period);color:var(--period-ink)}
.bar.pred{background:var(--period-soft);color:var(--period-soft-ink)}
.bar.fz{background:var(--fertile);color:var(--fertile-ink)}
.bar.ovp{background:var(--ov);color:var(--ov-ink);border-radius:9px;text-align:center;padding:0;margin:0 3px;z-index:1}
.bar.rs{border-top-left-radius:9px;border-bottom-left-radius:9px;margin-left:6px}
.bar.re{border-top-right-radius:9px;border-bottom-right-radius:9px;margin-right:6px}
.daypanel{margin-top:12px}
.dphead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dphead h3{margin:0;font-size:19px;font-weight:800}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.dchip{background:var(--surface2);border-radius:8px;padding:5px 10px;font-size:13.5px;font-weight:600;color:var(--muted)}
.dchip.p{background:var(--period-soft);color:var(--period-soft-ink)}
.dchip.f{background:var(--fertile);color:var(--fertile-ink)}
.dchip.o{background:var(--ov);color:var(--ov-ink)}
.hint{font-size:13px;color:var(--muted);margin:10px 4px 0}

/* continuous calendar */
.cal .wkh{border-bottom:1px solid var(--line)}
.cscroll{position:relative;overflow-y:auto;height:clamp(330px,calc(100dvh - var(--hh,58px) - 360px - env(safe-area-inset-bottom,0px)),620px);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cscroll::-webkit-scrollbar{display:none}
.cscroll .wrow:first-child{border-top:0}
.day{position:relative}
.day.mb{box-shadow:inset 0 2px 0 var(--muted)}
.day .ml{position:absolute;top:1px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;line-height:1;color:var(--period-soft-ink);white-space:nowrap}
.daypanel{margin-top:12px}
/* cycle history */
.htab{margin:0 -20px}
.hhd,.hr{display:grid;grid-template-columns:1fr 64px 56px;padding:12px 20px;font-variant-numeric:tabular-nums}
.hhd{background:var(--surface2);color:var(--muted);font-size:13.5px;padding:9px 20px}
.hr{font-size:16px}
.hr.cur{font-weight:700}
.hr .odd{color:var(--period);font-weight:700}
.hyear{font-size:17px;font-weight:800;margin:22px 0 10px}

/* report */
.cmp{display:block;width:100%;max-width:300px;margin:12px auto 0;height:auto}
.chartwrap{overflow-x:auto;margin-top:6px}
.chartwrap svg{width:100%;height:auto;min-width:290px;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border-radius:20px;padding:16px 18px}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.stat b small{font-size:15px;font-weight:600;margin-left:2px}
.stat span{font-size:13.5px;color:var(--muted)}
.alert{display:flex;gap:10px;padding:13px 14px;border-radius:14px;margin-bottom:8px;font-size:14.5px;line-height:1.5}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--surface2);color:var(--ink)}
.alert .ic{flex:none;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:14px}

/* forms */
label.f{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-size:16px}
textarea{resize:vertical;min-height:84px;font-size:14.5px;word-break:break-all}
.check{display:flex;align-items:center;gap:8px;font-size:15px;margin:12px 0}
.check input{width:20px;height:20px;accent-color:var(--btn)}
.field{margin-bottom:14px}
.partner{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.partner b{font-size:17px}
.partner p{margin:2px 0 12px;font-size:13.5px;color:var(--muted)}
ol.how{margin:0;padding-left:20px;font-size:14.5px}
ol.how li{margin-bottom:6px}

/* couple card */
.couple{text-align:center;padding-top:14px}
.couple svg{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.couple .ch{animation:bob 2.8s ease-in-out infinite}
.couple .ch.r{animation-delay:-1.4s}
.couple .hh{transform-box:fill-box;transform-origin:center;animation:beat 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes beat{0%,60%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.couple .ch,.couple .hh{animation:none}}
.cstat{margin:6px 0 16px;font-size:13.5px;color:var(--muted)}

/* appearance settings */
.modeseg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:18px}
.modeseg button{border:0;background:transparent;border-radius:10px;padding:9px 0;font-size:14.5px;color:var(--muted)}
.modeseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:7px;padding:0;font-size:13px;color:var(--muted)}
.sw .dot{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw .dot i{width:24px;height:24px;border-radius:50%}
.sw[aria-pressed="true"]{color:var(--ink);font-weight:700}
.sw[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;padding:9px 0 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.75}
nav.tabs svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;opacity:1}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.sheet .in{max-width:520px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.shead{position:sticky;top:-8px;z-index:2;background:var(--surface);margin:-8px -20px 0;padding:10px 20px 4px;touch-action:none}
.shrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.xbtn{flex:none;border:0;background:var(--surface2);color:var(--ink);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.xbtn svg{width:18px;height:18px}
.sheet h3{margin:0;font-size:21px;font-weight:800}
.sheet .st{margin:2px 0 16px;color:var(--muted);font-size:14.5px}
.sacts{display:grid;gap:8px;margin-bottom:22px}
.grp{margin-bottom:18px}
.grp .lb{font-size:14.5px;font-weight:700;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{border:1.5px solid transparent;background:var(--surface2);border-radius:14px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13.5px}
.tile .ic{font-size:20px;line-height:1.2;letter-spacing:-2px}
.tile[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid transparent;background:var(--surface2);border-radius:999px;padding:8px 14px;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:11px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <h1 id="ttl">둘의 달력</h1>
  <div class="seg" id="who" hidden></div>
  <button class="iconbtn" id="gear" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="메뉴"><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16" fill="currentColor"/></svg>오늘</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>달력</button>
  <button data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>리포트</button>
  <button data-tab="connect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/></svg>연결</button>
</div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>
(function(){
const KEY='dul-cycle:v1';
const APP_VERSION='2026.11.18-6';
const FLOW=['없음','적음','보통','많음'];
const PAIN=['없음','약함','보통','심함'];
const MOODS=['좋음','평온','예민','우울','불안','피곤'];
const MOOD_EM={'좋음':'😊','평온':'😌','예민':'😤','우울':'😢','불안':'😰','피곤':'😴'};
const SYMS=['복통','요통','두통','유방통','여드름','붓기','소화불량','식욕 증가','불면','어지러움'];
const WD=['일','월','화','수','목','금','토'];
const DRE=/^\d{4}-\d{2}-\d{2}$/;

// ---------- dates ----------
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>{const A=parse(a),B=parse(b);return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate())-Date.UTC(A.getFullYear(),A.getMonth(),A.getDate()))/864e5)};
const TODAY=ymd(new Date());
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- storage (this device only) ----------
const blank=()=>({days:[],logs:{},settings:{cycleLen:28,periodLen:5,name:'',mode:'system',theme:'coral'},partner:null,sync:null});
function load(){
  try{const r=localStorage.getItem(KEY);if(!r)return blank();const d=JSON.parse(r);const b=blank();
    return {days:Array.isArray(d.days)?d.days:[],logs:d.logs||{},settings:Object.assign(b.settings,d.settings||{}),partner:d.partner||null,sync:d.sync&&typeof d.sync.secret==='string'?d.sync:null};
  }catch(e){return blank()}
}
let data=load();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('저장하지 못했어요. 브라우저의 저장 공간 설정을 확인해 주세요.')}}
function save(){if(data.sync)data.sync.dirty=true;saveLocal();schedulePush()}

function goTab(t){
  if(t!==tab){
    const onSub=history.state&&history.state.dul==='tab';
    if(t==='home'){if(onSub){ignorePop=true;history.back()}}
    else if(!onSub)history.pushState({dul:'tab'},'');
    tab=t;
  }
  render();if(t!=='cal')window.scrollTo(0,0);
}
const isViewer=()=>!!(data.sync&&data.sync.role==='B');
const partnerHasData=()=>!!(data.partner&&data.partner.days&&data.partner.days.length);
function preferPartner(){return partnerHasData()&&(isViewer()||(!data.sync&&!data.days.length))}
let userPicked=false;
let selDate=TODAY,tab='home',viewing=preferPartner()?'partner':'me',cursor=(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)})();

function profile(){
  if(isViewer()||(viewing==='partner'&&partnerHasData())){const p=data.partner||{};return {days:p.days||[],logs:p.logs||{},settings:p.settings||{cycleLen:28,periodLen:5},name:p.name||'연인',readonly:true}}
  return {days:data.days,logs:data.logs,settings:data.settings,name:data.settings.name||'나',readonly:false};
}

// ---------- analysis ----------
function groups(days){
  const s=[...new Set(days)].filter(d=>DRE.test(d)).sort();const out=[];
  for(const d of s){const g=out[out.length-1];if(g&&diff(g.end,d)<=2){g.end=d;g.days.push(d)}else out.push({start:d,end:d,days:[d]})}
  out.forEach(g=>g.len=diff(g.start,g.end)+1);return out;
}
function analyze(p){
  const periods=groups(p.days);const starts=periods.map(x=>x.start);
  const cycles=[];for(let i=1;i<starts.length;i++)cycles.push({start:starts[i-1],len:diff(starts[i-1],starts[i]),plen:periods[i-1].len});
  const valid=cycles.map(c=>c.len).filter(c=>c>=15&&c<=60).slice(-6);
  const avgCycle=valid.length?Math.round(mean(valid)):(+p.settings.cycleLen||28);
  const lens=periods.slice(-6).map(x=>x.len);
  const avgPeriod=lens.length?Math.round(mean(lens)):(+p.settings.periodLen||5);
  const r={periods,cycles,valid,avgCycle,avgPeriod,variability:valid.length>=2?Math.max(...valid)-Math.min(...valid):null,map:{},last:null,next:null,late:0,cycleDay:null,ov:null,predStarts:[]};
  if(!periods.length)return r;
  const M=r.map,pri={period:4,pred:3,ov:2,fertile:1};
  const mark=(d,t)=>{if(!M[d]||pri[t]>pri[M[d]])M[d]=t};
  const fert=ov=>{for(let i=-5;i<=1;i++)mark(addDays(ov,i),i===0?'ov':'fertile')};
  const last=periods[periods.length-1];r.last=last;
  r.next=addDays(last.start,avgCycle);r.ov=addDays(r.next,-14);
  if(r.next<TODAY)r.late=diff(r.next,TODAY);
  r.cycleDay=diff(last.start,TODAY)+1;
  periods.forEach((g,i)=>{const ns=i+1<periods.length?periods[i+1].start:r.next;const L=diff(g.start,ns);if(L>=15&&L<=60)fert(addDays(ns,-14))});
  const base=r.next>=TODAY?r.next:addDays(TODAY,1);
  for(let k=0;k<6;k++){const s=addDays(base,k*avgCycle);r.predStarts.push(s);for(let j=0;j<avgPeriod;j++)mark(addDays(s,j),'pred');fert(addDays(s,avgCycle-14))}
  p.days.forEach(d=>mark(d,'period'));
  return r;
}
function phaseKey(a){
  if(!a.last)return 'none';const t=a.map[TODAY];
  if(t==='period')return 'period';if(t==='ov')return 'ov';if(t==='fertile')return 'fertile';
  if(a.late>0)return 'late';if(t==='pred')return 'pred';
  return TODAY<a.ov?'follicular':'luteal';
}
const PHASE={
  none:{short:'기록 전'},period:{short:'생리기'},pred:{short:'생리 예정 기간'},follicular:{short:'난포기'},
  fertile:{short:'가임기'},ov:{short:'배란 예정일'},luteal:{short:'황체기'},late:{short:'예정일 지남'}
};
const TITLE={
  period:['생리 중엔 몸을 따뜻하게','{n}님은 지금 생리 중이에요'],
  follicular:['컨디션이 올라오는 시기예요','{n}님은 컨디션이 좋은 시기예요'],
  fertile:['임신 가능성이 높은 시기예요','지금은 임신 가능성이 높은 시기예요'],
  ov:['오늘은 배란 예정일이에요','오늘은 배란 예정일이에요'],
  luteal:['생리 전 증후군(PMS)이 나타날 수 있어요','{n}님이 예민해질 수 있는 시기예요'],
  pred:['곧 생리가 시작될 수 있어요','곧 생리가 시작될 수 있어요'],
  late:['생리가 늦어지고 있어요','생리가 늦어지고 있어요'],
  none:['생리 시작일을 기록해 보세요','아직 공유된 기록이 없어요']
};
const TIPS={
  period:{me:[['🫖','몸을 따뜻하게 하고, 아랫배 찜질이 통증 완화에 도움이 될 수 있어요.'],['🥬','출혈로 철분이 빠져나가요. 시금치, 붉은 고기, 콩류를 챙겨 보세요.'],['🧘','격한 운동보다 걷기나 가벼운 스트레칭이 편해요.']],
          partner:[['🫖','따뜻한 차나 핫팩을 챙겨 주면 좋아요.'],['🛋️','피곤하기 쉬운 시기예요. 무리한 일정은 미뤄 주세요.'],['💬','몸 상태를 먼저 물어봐 주세요.']]},
  follicular:{me:[['⚡','에너지가 올라오는 시기예요. 새 운동을 시작하기 좋아요.'],['🗓️','컨디션이 좋은 편이라 중요한 일정을 잡기 괜찮아요.']],
          partner:[['🌿','컨디션이 좋은 편인 시기예요. 활동적인 데이트를 계획해 보세요.']]},
  fertile:{me:[['💧','투명하고 미끈한 분비물이 늘 수 있어요.'],['⚠️','임신 가능성이 높은 시기예요. 앱의 날짜만으로 피임을 판단하지 마세요.']],
          partner:[['⚠️','임신 가능성이 높은 시기예요. 피임에 특히 신경 써 주세요.']]},
  ov:{me:[['🌡️','한쪽 아랫배가 살짝 당기는 배란통이 있을 수 있어요.'],['⚠️','임신 가능성이 가장 높은 날이에요.']],
          partner:[['⚠️','임신 가능성이 가장 높은 날이에요. 피임에 신경 써 주세요.']]},
  luteal:{me:[['🧂','붓기가 생기기 쉬워요. 짠 음식과 카페인을 줄이면 편해요.'],['😮‍💨','생리 전 예민함, 식욕 증가는 흔한 변화예요. 잠을 충분히 자 보세요.']],
          partner:[['🤍','생리 전이라 예민하거나 지칠 수 있어요. 평소보다 조금 더 배려해 주세요.'],['🍫','단 게 당길 수 있는 시기예요.']]},
  pred:{me:[['🎒','생리대나 탐폰을 미리 챙겨 두세요.']],partner:[['🎒','곧 생리가 시작될 수 있어요. 일정에 여유를 두세요.']]},
  late:{me:[['📝','스트레스, 수면, 체중 변화로도 늦어질 수 있어요.'],['🩺','관계가 있었다면 임신 테스트를 해 보고, 많이 늦어지면 진료를 받아 보세요.']],
          partner:[['🤍','예정일이 지났어요. 걱정을 키우기보다 함께 이야기해 보세요.']]},
  none:{me:[['✍️','생리를 시작한 날을 기록하면 예측이 시작돼요.']],partner:[['🔗','연인에게 새 공유 코드를 받아 보세요.']]}
};

// ---------- UI shell ----------
const $=s=>document.querySelector(s);
const view=$('#view');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
function renderWho(){
  const w=$('#who');
  if(isViewer()||!partnerHasData()){w.hidden=true;if(!isViewer())viewing='me';return}
  w.hidden=false;
  const me='<button data-who="me" aria-pressed="'+(viewing==='me')+'">'+esc(data.settings.name||'나')+'</button>',pt='<button data-who="partner" aria-pressed="'+(viewing==='partner')+'">'+esc(data.partner.name||'연인')+'</button>';
  w.innerHTML=preferPartner()?pt+me:me+pt;
}
const THEMES=[['coral','기본','#F6F6F4','#EE6A44','#6A4FA0'],['rose','로즈','#FAF6F7','#E0567D','#3F6FB5'],['lavender','라벤더','#F6F5FA','#D2649A','#7A5CD6'],['ocean','오션','#F4F7F9','#E8705A','#2F7FD0']];
function applyTheme(){
  const r=document.documentElement,st=data.settings;
  if(st.mode==='light'||st.mode==='dark')r.setAttribute('data-theme',st.mode);else r.removeAttribute('data-theme');
  if(st.theme&&st.theme!=='coral')r.setAttribute('data-palette',st.theme);else r.removeAttribute('data-palette');
  const mf=document.getElementById('mf');if(mf){const h=(st.theme&&st.theme!=='coral')?'manifest-'+st.theme+'.json':'manifest.json';if(mf.getAttribute('href')!==h)mf.setAttribute('href',h)}
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',getComputedStyle(document.body).backgroundColor);
}
let lastRendered=null;
function render(){
  renderWho();
  const td=parse(TODAY);
  $('#ttl').textContent={home:(td.getMonth()+1)+'월 '+td.getDate()+'일('+WD[td.getDay()]+')',cal:'달력',report:'리포트',connect:'연결',settings:'설정'}[tab];
  document.querySelectorAll('nav.tabs button').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  const keepY=(tab==='cal'&&lastRendered==='cal')?window.scrollY:null;
  document.documentElement.style.setProperty('--hh',$('header.top').offsetHeight+'px');
  view.classList.toggle('calmode',tab==='cal');
  ({home:renderHome,cal:renderCal,report:renderReport,connect:renderConnect,settings:renderSettings})[tab]();
  if(tab==='cal'&&keepY!==null)window.scrollTo(0,keepY);
  lastRendered=tab;
}

// ---------- today tab ----------
function statusText(a){
  const k=phaseKey(a);
  if(!a.last)return {big:'첫 생리일을 기록해 보세요',small:'기록하면 다음 생리와 가임기를 예측해요'};
  const sub=PHASE[k].short;
  if(k==='period'){const g=a.periods.find(g=>g.days.includes(TODAY))||a.last;return {big:'생리 '+(diff(g.start,TODAY)+1)+'일째',small:sub}}
  if(a.late>0)return {big:'예정일보다 '+a.late+'일 늦어요',small:'예정일 '+md(a.next)};
  const dn=diff(TODAY,a.next);
  return {big:dn===0?'오늘 생리 예정일이에요':'생리 '+dn+'일 전',small:sub};
}
function partnerNotice(a,name){
  if(!a.last)return '';const k=phaseKey(a);let t;
  if(k==='period'){const g=a.periods.find(g=>g.days.includes(TODAY))||a.last;t=name+'님은 생리 '+(diff(g.start,TODAY)+1)+'일째예요.'}
  else if(a.late>0)t=name+'님의 생리가 예정일보다 '+a.late+'일 늦어지고 있어요.';
  else{const dn=diff(TODAY,a.next);t=name+'님의 생리가 '+(dn===0?'오늘':dn===1?'내일':dn+'일 뒤')+' 시작될 예정이에요.'}
  return '<div class="notice"><span class="bell"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></span><div><small>'+esc(name)+'님의 달력</small><b>'+esc(t)+'</b></div></div>';
}
function cycleBar(a){
  if(!a.last)return '';
  const L=Math.max(a.avgCycle,a.cycleDay),ov=a.avgCycle-14,pct=v=>(Math.max(0,v)/L*100).toFixed(2)+'%';
  return '<div class="cbar"><div class="track"><span class="seg p" style="left:0;width:'+pct(Math.min(a.last.len,L))+'"></span>'+
    (ov>6?'<span class="seg f" style="left:'+pct(ov-6)+';width:'+pct(7)+'"></span><span class="seg o" style="left:'+pct(ov-1)+';width:'+pct(1)+'"></span>':'')+
    '<span class="now" style="left:'+pct(Math.min(a.cycleDay,L)-.5)+'"></span></div><div class="cbl"><span>주기 '+a.cycleDay+'일째</span><span>배란 예정 '+md(a.ov)+'</span></div></div>';
}
function recList(lg,empty){
  lg=lg||{};const r=[];
  if(lg.flow)r.push(['var(--period)','생리 양',FLOW[lg.flow]]);
  if(lg.pain)r.push(['var(--point)','통증',PAIN[lg.pain]]);
  if(lg.mood)r.push(['var(--mood)','기분',MOOD_EM[lg.mood]+' '+lg.mood]);
  if(lg.symptoms&&lg.symptoms.length)r.push(['var(--muted)','증상',lg.symptoms.join(', ')]);
  if(lg.note)r.push(['var(--ink)','메모',lg.note]);

function renderCal(){
  const p=profile(),a=analyze(p),t0=parse(TODAY);
  let start=new Date(t0.getFullYear(),t0.getMonth()-12,1);
  if(p.days.length){const f=parse(p.days[0]),fm=new Date(f.getFullYear(),f.getMonth(),1);if(fm<start)start=fm}
  const lim=new Date(t0.getFullYear()-3,0,1);if(start<lim)start=lim;
  const endDay=ymd(new Date(t0.getFullYear(),t0.getMonth()+13,0));
  const BL={period:'생리',pred:'생리 예정',fz:'가임기'};
  let ws=ymd(new Date(start.getFullYear(),start.getMonth(),1-start.getDay())),rows='';
  for(;ws<=endDay;ws=addDays(ws,7)){
    const ds=[];for(let i=0;i<7;i++)ds.push(addDays(ws,i));
    let days='',bars='';
    ds.forEach(s=>{const d=parse(s),c=['day'];if(s===TODAY)c.push('today');if(s===selDate)c.push('sel');

      const t=bandType(a.map[ds[i]]||'');if(!t){i++;continue}
      let j=i;while(j+1<7&&bandType(a.map[ds[j+1]]||'')===t)j++;
      const rs=bandType(a.map[addDays(ds[i],-1)]||'')!==t,re=bandType(a.map[addDays(ds[j],1)]||'')!==t;
      bars+='<span class="bar '+t+(rs?' rs':'')+(re?' re':'')+'" style="grid-column:'+(i+1)+' / '+(j+2)+'">'+(rs?BL[t]:'')+'</span>';
      i=j+1;
    }
    ds.forEach((s,i)=>{if(a.map[s]==='ov')bars+='<span class="bar ovp" style="grid-column:'+(i+1)+' / '+(i+2)+'">배란일</span>'});

    '<div class="cal"><div class="wkh">'+WD.map(w=>'<span>'+w+'</span>').join('')+'</div><div class="cscroll" id="cs">'+rows+'</div></div>'+
    '<div class="card daypanel" id="dpanel">'+panelHtml(p,a)+'</div>'+
    '<p class="note">배란일과 가임기는 평균 주기로 계산한 추정치라 피임 수단으로 쓰기에는 정확하지 않아요.</p>';
  const cs=$('#cs');

  syncCalLabel();
  cs.addEventListener('scroll',()=>{calTop=cs.scrollTop;if(calTick)return;calTick=true;requestAnimationFrame(()=>{calTick=false;syncCalLabel()})},{passive:true});

function setDays(list){data.days=[...new Set(list)].sort();save()}
function logSet(d,k,v){
  const lg=Object.assign({},data.logs[d]||{});

  else if(k==='flow'||k==='pain'){const n=+v;if(lg[k]===n)delete lg[k];else lg[k]=n}
  else if(k==='mood'){if(lg.mood===v)delete lg.mood;else lg.mood=v}
  else if(k==='note'){if(v.trim())lg.note=v.slice(0,300);else delete lg.note}
  if(Object.keys(lg).length)data.logs[d]=lg;else delete data.logs[d];save();
}

function lineChart(cs){

  const cw=(W-L-R)/n,x=i=>L+cw*(i+.5),y=v=>T+(H-T-B)*(1-v/mx),off=v=>v<21||v>35;

  cs.forEach((c,i)=>{s+='<rect x="'+(x(i)-14).toFixed(1)+'" y="'+y(c.len).toFixed(1)+'" width="28" height="'+(H-B-y(c.len)).toFixed(1)+'" rx="6" fill="'+(off(c.len)?'var(--period-soft)':'var(--point-soft)')+'"/>'});
  if(n>1)s+='<polyline fill="none" stroke="var(--point)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+cs.map((c,i)=>x(i).toFixed(1)+','+y(c.len).toFixed(1)).join(' ')+'"/>';
  cs.forEach((c,i)=>{const col=off(c.len)?'var(--period)':'var(--point)',d=parse(c.start);

      '<text x="'+x(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+(d.getMonth()+1)+'.'+d.getDate()+'</text>'});
  return '<div class="chartwrap">'+s+'</svg></div>';
}
function cycleRows(a){

function histTable(rows){

  }

function cleanLogs(x){const o={};if(!x||typeof x!=='object')return o;for(const [d,v] of Object.entries(x)){if(!DRE.test(d)||!v||typeof v!=='object')continue;const l={};
  if(Number.isInteger(v.flow)&&v.flow>0&&v.flow<4)l.flow=v.flow;if(Number.isInteger(v.pain)&&v.pain>0&&v.pain<4)l.pain=v.pain;if(MOODS.includes(v.mood))l.mood=v.mood;
  if(Array.isArray(v.symptoms)){const s=v.symptoms.filter(z=>SYMS.includes(z));if(s.length)l.symptoms=s}if(typeof v.note==='string'&&v.note.trim())l.note=v.note.slice(0,300);
  if(Object.keys(l).length)o[d]=l}return o}

function readCode(text){const m=String(text).match(/(DULB?1)\.([A-Za-z0-9_-]+)/);if(!m)throw new Error('코드를 찾지 못했어요. 받은 메시지 전체를 붙여넣어 보세요.');

const b64d=str=>{let s=str.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};

function charSvg(cx,cy,fill,stroke,deco,side,sleepy){
  const b='M'+(cx-40)+','+(cy+30)+' C'+(cx-48)+','+(cy-12)+' '+(cx-30)+','+(cy-46)+' '+cx+','+(cy-46)+' C'+(cx+30)+','+(cy-46)+' '+(cx+48)+','+(cy-12)+' '+(cx+40)+','+(cy+30)+' Q'+cx+','+(cy+40)+' '+(cx-40)+','+(cy+30)+'Z';
  const arm=side*41;
  let g='<path d="'+b+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5" stroke-linejoin="round"/>'+
    '<circle cx="'+(cx+side*40)+'" cy="'+(cy-6)+'" r="7.5" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/>'+
    '<circle cx="'+(cx-side*38)+'" cy="'+(cy+14)+'" r="7" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/>';
  if(deco==='bow')g+='<g transform="translate('+(cx-20)+','+(cy-42)+') rotate(-18)"><path d="M0,0 L-11,-7 L-11,7Z M0,0 L11,-7 L11,7Z" fill="'+stroke+'"/><circle r="3.4" fill="'+stroke+'"/></g>';
  if(deco==='leaf')g+='<path d="M'+cx+','+(cy-45)+' q-2,-10 4,-16" fill="none" stroke="'+stroke+'" stroke-width="2.5" stroke-linecap="round"/><path d="M'+(cx+4)+','+(cy-61)+' q12,-4 16,4 q-10,8 -16,-4z" fill="'+stroke+'"/>';
  if(sleepy)g+='<path d="M'+(cx-17)+','+(cy-8)+' h9 M'+(cx+8)+','+(cy-8)+' h9" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/><text x="'+(cx+30)+'" y="'+(cy-40)+'" font-size="15" font-weight="700" fill="var(--muted)">z</text><text x="'+(cx+39)+'" y="'+(cy-52)+'" font-size="11" font-weight="700" fill="var(--muted)">z</text>';
  else g+='<ellipse cx="'+(cx-12)+'" cy="'+(cy-8)+'" rx="3.4" ry="4.4" fill="var(--ink)"/><ellipse cx="'+(cx+12)+'" cy="'+(cy-8)+'" rx="3.4" ry="4.4" fill="var(--ink)"/><circle cx="'+(cx-11)+'" cy="'+(cy-10)+'" r="1.2" fill="#fff"/><circle cx="'+(cx+13)+'" cy="'+(cy-10)+'" r="1.2" fill="#fff"/>';
  g+='<circle cx="'+(cx-22)+'" cy="'+(cy+4)+'" r="5.5" fill="#F49AA8" opacity=".55"/><circle cx="'+(cx+22)+'" cy="'+(cy+4)+'" r="5.5" fill="#F49AA8" opacity=".55"/>'+
    '<path d="M'+(cx-6)+','+(cy+3)+' Q'+cx+','+(cy+10)+' '+(cx+6)+','+(cy+3)+'" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>';
  return g;
}
function coupleCard(lN,rN){
  const cut=n=>n.length>8?n.slice(0,8)+'…':n,lw=!lN,rw=!rN,wait=lw||rw;
  const heart='<path class="hh" d="M160,86 C142,72 136,60 144,52 C150,46 158,48 160,55 C162,48 170,46 176,52 C184,60 178,72 160,86Z" fill="'+(wait?'none':'var(--period)')+'" stroke="'+(wait?'var(--muted)':'var(--period)')+'" stroke-width="2.5" stroke-dasharray="'+(wait?'4 4':'0')+'"/>';
  return '<svg viewBox="0 0 320 170" role="img" aria-label="'+esc(lw?'기다리는 중':lN)+(wait?'':' 하트')+' '+esc(rw?'기다리는 중':rN)+'">'+
    '<path d="M116,86 Q160,'+(wait?'86':'108')+' 204,86" fill="none" stroke="'+(wait?'var(--line)':'var(--period-soft)')+'" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>'+heart+
    '<g class="ch">'+charSvg(68,92,lw?'var(--surface2)':'var(--period-soft)',lw?'var(--muted)':'var(--period)','bow',1,lw)+'</g>'+
    '<g class="ch r">'+charSvg(252,92,rw?'var(--surface2)':'var(--point-soft)',rw?'var(--muted)':'var(--point)','leaf',-1,rw)+'</g>'+
    '<text x="68" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="'+(lw?'var(--muted)':'var(--ink)')+'">'+esc(lw?'기다리는 중':cut(lN))+'</text>'+
    '<text x="252" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="'+(rw?'var(--muted)':'var(--ink)')+'">'+esc(rw?'기다리는 중':cut(rN))+'</text></svg>';
}
function renderConnect(){if(SYNC_ON)renderSync();else renderManual()}
function syncInit(){
  if(!SYNC_ON)return;
  const tick=()=>{if(!data.sync)return;pull().then(()=>{if(data.sync&&data.sync.dirty)push()})};
  tick();
  setInterval(()=>{if(document.visibilityState==='visible')tick()},30000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tick()});
  window.addEventListener('online',tick);
}

// ---------- connect tab ----------
let lastShare='';
function renderManual(){
  const p=data.partner;
  let h=(p?'<div class="card couple">'+coupleCard(data.settings.name||'나',p.name||'연인')+'<p class="cstat">'+timeStr(p.at)+'에 받은 정보예요</p></div>':'')+'<div class="card"><h3 class="serif">내 달력 보내기</h3><p class="sub">서버 없이 코드로 주고받아요. 기록이 바뀌면 코드를 다시 보내 주세요.</p>'+
    '<div class="field"><label class="f" for="myname">상대에게 보일 내 이름</label><input type="text" id="myname" maxlength="20" value="'+esc(data.settings.name)+'" placeholder="예: 지민"></div>'+
    '<label class="check"><input type="checkbox" id="withlogs" checked> 증상과 메모도 함께 보내기</label>'+
    '<button class="btn full" data-c="make">공유 코드 만들기</button>'+
    (lastShare?'<div style="margin-top:12px"><textarea readonly id="sharecode">'+esc(lastShare)+'</textarea><div class="row" style="margin-top:8px"><button class="btn" data-c="send" style="flex:1">메시지로 보내기</button><button class="btn ghost" data-c="copy" style="flex:1">복사</button></div></div>':'')+'</div>';
  h+='<div class="card"><h3 class="serif">연인 달력 받기</h3><p class="sub">받은 코드를 붙여넣으면 연인의 달력을 볼 수 있어요. 새 코드를 넣으면 최신 내용으로 바뀌어요.</p>'+
    '<textarea id="incode" placeholder="받은 메시지를 그대로 붙여넣어 주세요"></textarea><button class="btn full" style="margin-top:8px" data-c="import">불러오기</button>';
  if(p){
    const a=analyze({days:p.days,logs:p.logs||{},settings:p.settings});
    h+='<div class="partner"><b class="serif">'+esc(p.name||'연인')+'</b><p>'+new Date(p.at).toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'numeric',minute:'2-digit'})+'에 보낸 정보, 생리 기록 '+a.periods.length+'회'+(a.next?', 다음 예정 '+md(a.next):'')+'</p>'+
      '<div class="row"><button class="btn" data-c="viewp" style="flex:1">오늘 보기</button><button class="btn danger" data-c="delp">지우기</button></div></div>';
  }
  h+='</div><div class="card"><h3 class="serif">이렇게 써요</h3><ol class="how"><li>두 사람 모두 이 페이지를 각자 휴대폰에서 열어요.</li><li>기록하는 사람이 공유 코드를 만들어 메신저로 보내요.</li><li>받은 사람은 코드를 붙여넣고, 위쪽에서 이름을 눌러 화면을 바꿔 봐요.</li></ol><p class="note" style="margin:10px 0 0">코드에는 건강 정보가 담겨 있으니 연인에게만 보내 주세요.</p></div>';
  view.innerHTML=h;
}

// ---------- settings ----------
function renderSettings(){
  const st=data.settings,mode=st.mode||'system',th=st.theme||'coral';
  const look='<div class="card"><h3>화면</h3><p class="sub">이 폰에만 적용돼요</p>'+
    '<div class="modeseg">'+[['system','시스템'],['light','밝게'],['dark','어둡게']].map(m=>'<button data-mode="'+m[0]+'" aria-pressed="'+(mode===m[0])+'">'+m[1]+'</button>').join('')+'</div>'+
    '<div class="swatches" style="margin-bottom:2px">'+THEMES.map(t=>'<button class="sw" data-theme-pick="'+t[0]+'" aria-pressed="'+(th===t[0])+'"><span class="dot" style="background:'+t[2]+'"><i style="background:linear-gradient(90deg,'+t[3]+' 50%,'+t[4]+' 50%)"></i></span>'+t[1]+'</button>').join('')+'</div></div>';
  const inst=isStandalone()?'':'<div class="card"><h3>앱으로 설치</h3><p class="sub">설치하면 주소창과 브라우저 메뉴 없이 앱처럼 열려요. 아이콘 색은 설치할 때 고른 테마를 따라가요.</p>'+
    (installEvt?'<button class="btn full" data-c="install">앱 설치하기</button>':'<p class="sub" style="margin:0">브라우저 메뉴(⋮ 또는 ≡)에서 <b>앱 설치</b> 또는 <b>홈 화면에 추가 → 설치</b>를 골라 주세요. 이미 바로가기로 추가한 아이콘이 있다면 먼저 지우고 다시 설치해야 주소창 없이 열려요.</p>')+'</div>';
  setTimeout(()=>{if(isViewer())view.querySelectorAll('.card').forEach(c=>{const t=c.querySelector('h3');if(t&&(t.textContent==='기본값'||t.textContent==='백업과 복원'))c.remove()})});
  view.innerHTML=inst+look+'<div class="card"><h3 class="serif">기본값</h3><p class="sub">기록이 2번 미만일 때 예측에 쓰여요. 기록이 쌓이면 실제 평균으로 바뀌어요.</p>'+
    '<div class="row"><div class="field" style="flex:1"><label class="f" for="cl">주기 길이(일)</label><input type="number" id="cl" min="15" max="60" inputmode="numeric" value="'+data.settings.cycleLen+'"></div>'+
    '<div class="field" style="flex:1"><label class="f" for="pl">생리 기간(일)</label><input type="number" id="pl" min="1" max="14" inputmode="numeric" value="'+data.settings.periodLen+'"></div></div>'+
    '<button class="btn full" data-c="saveset">저장</button></div>'+
    '<div class="card"><h3 class="serif">백업과 복원</h3><p class="sub">'+(SYNC_ON&&data.sync?'자동 동기화 중이라 서버에 암호화된 사본이 있어요. 폰을 바꾸면 연결 탭의 복구 코드로 되살릴 수 있어요. 백업 코드는 추가 보관용이에요.':'기록은 이 휴대폰에만 저장돼요. 브라우저 데이터를 지우거나 휴대폰을 바꾸면 사라지니 가끔 백업 코드를 나에게 보내 두세요.')+'</p>'+
    '<button class="btn ghost full" data-c="backup">백업 코드 만들기</button>'+
    '<textarea id="rcode" style="margin-top:12px" placeholder="백업 코드를 붙여넣어 복원"></textarea><button class="btn ghost full" style="margin-top:8px" data-c="restore">복원하기</button></div>'+
    '<div class="card"><h3 class="serif">데이터 지우기</h3><p class="sub">이 휴대폰에 저장된 내 기록과 연인 정보를 모두 지워요.</p><button class="btn danger full" data-c="wipe">모두 지우기</button></div>'+
    '<p class="note" style="text-align:center">버전 '+APP_VERSION+'</p>';
}

// ---------- events ----------
view.addEventListener('change',e=>{if(e.target.id==='sharelogs'&&data.sync){data.sync.shareLogs=e.target.checked;save();toast(e.target.checked?'증상과 메모도 공유해요':'생리 날짜만 공유해요')}});
view.addEventListener('input',e=>{if(e.target.id==='myname'){data.settings.name=e.target.value.slice(0,20);save();renderWho()}});
view.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.date){const d=b.dataset.date;selDate=d;if(swallowClick){swallowClick=false;return}if(tab!=='cal'){const x=parse(d);cursor=new Date(x.getFullYear(),x.getMonth(),1);goTab('cal')}else updateSel();return}
  if(b.dataset.q){
    if(b.dataset.q==='start'){startAt(TODAY);toast('오늘부터 생리로 기록했어요')}
    if(b.dataset.q==='end'){endAt(TODAY);toast('오늘 생리가 끝난 것으로 기록했어요')}
    if(b.dataset.q==='log'){openSheet(TODAY);return}
    if(b.dataset.q==='edit'||b.dataset.q==='peek'){openSheet(selDate);return}
    if(b.dataset.q==='hist'){openSheet('history');return}
    if(b.dataset.q==='tocal'){selDate=TODAY;const x=new Date();cursor=new Date(x.getFullYear(),x.getMonth(),1);goTab('cal');return}
    render();return;
  }
  if(b.dataset.mode){data.settings.mode=b.dataset.mode;saveLocal();applyTheme();render();return}
  if(b.dataset.themePick){data.settings.theme=b.dataset.themePick;saveLocal();applyTheme();render();return}
  if(b.dataset.nav!==undefined){const n=+b.dataset.nav;if(n===0){selDate=TODAY;updateSel();scrollToDate(TODAY,true,1)}else{const t=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);scrollToDate(ymd(t),true,0)}return}
  const c=b.dataset.c;if(!c)return;
  if(c==='install'){if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}return}
  if(c==='pair-new'){
    if(!data.settings.name){toast('먼저 상대에게 보일 이름을 적어 주세요');$('#myname').focus();return}
    data.sync={secret:b64e(crypto.getRandomValues(new Uint8Array(32))),role:'A',shareLogs:true,dirty:true,since:Date.now()};keys=null;saveLocal();
    sendText(inviteText(),'둘의 달력 초대 코드');push();render();return;
  }
  if(c==='pair-join'){try{const code=parsePair($('#paircode').value);joinWith(code)}catch(err){toast(err.message)}return}
  if(c==='sync-now'){syncState.status='idle';renderConnect();pull().then(push);return}
  if(c==='send-invite'){sendText(inviteText(),'둘의 달력 초대 코드');return}
  if(c==='send-recover'){sendText('둘의 달력 복구 코드 (나만 보관하세요)\n'+pairCode(data.sync.role),'둘의 달력 복구 코드');return}
  if(c==='unpair'){
    if(!confirm('연결을 끊고 서버에 있는 내 암호화 기록을 지울까요?'))return;
    const go=()=>{data.sync=null;data.partner=null;keys=null;viewing='me';saveLocal();toast('연결을 끊었어요');render()};
    ensureKeys().then(k=>rpc('delete_vault',{p_id:k.mine})).then(go,()=>{toast('서버 기록은 지우지 못했어요. 이 폰의 연결만 끊어요.');go()});return;
  }
  if(c==='make'){
    if(!data.days.length){toast('먼저 생리일을 기록해 주세요');return}
    const payload={v:1,name:data.settings.name||'',days:data.days,settings:{cycleLen:data.settings.cycleLen,periodLen:data.settings.periodLen},at:Date.now()};
    if($('#withlogs').checked)payload.logs=data.logs;
    lastShare=(data.settings.name||'내')+' 달력 공유 코드예요. 둘의 달력의 연결 탭에 붙여넣어 주세요.\nDUL1.'+enc(payload);
    renderConnect();
  }
  if(c==='send')sendText(lastShare,'달력 공유 코드');
  if(c==='copy')copy(lastShare);
  if(c==='import'){
    try{const {kind,o}=readCode($('#incode').value);
      if(kind==='DULB1'){toast('백업 코드예요. 설정의 복원에서 사용해 주세요.');return}
      data.partner={name:typeof o.name==='string'?o.name.slice(0,20):'연인',days:cleanDays(o.days),logs:cleanLogs(o.logs),settings:cleanSettings(o.settings),at:typeof o.at==='number'?o.at:Date.now()};
      save();toast((data.partner.name||'연인')+'님의 달력을 불러왔어요');render();
    }catch(err){toast(err.message)}
  }
  if(c==='viewp'){viewing='partner';goTab('home')}
  if(c==='delp'){if(confirm('연인의 달력 정보를 이 휴대폰에서 지울까요?')){data.partner=null;viewing='me';save();render()}}
  if(c==='saveset'){data.settings.cycleLen=clamp($('#cl').value,15,60,28);data.settings.periodLen=clamp($('#pl').value,1,14,5);save();toast('설정을 저장했어요');render()}
  if(c==='backup'){sendText('둘의 달력 백업 코드 '+TODAY+'\nDULB1.'+enc({v:1,days:data.days,logs:data.logs,settings:data.settings,at:Date.now()}),'둘의 달력 백업')}
  if(c==='restore'){
    try{const {kind,o}=readCode($('#rcode').value);if(kind!=='DULB1'){toast('백업 코드가 아니에요. 연인의 공유 코드는 연결 탭에 넣어 주세요.');return}
      if(!confirm('지금 이 휴대폰의 내 기록을 백업 내용으로 바꿀까요?'))return;
      data.days=cleanDays(o.days);data.logs=cleanLogs(o.logs);data.settings=Object.assign({mode:data.settings.mode,theme:data.settings.theme},cleanSettings(o.settings));save();toast('백업을 복원했어요');render();
    }catch(err){toast(err.message)}
  }
  if(c==='wipe'){if(confirm('이 폰의 내 기록, 연인 정보, 연결을 모두 지울까요? 되돌릴 수 없어요.')){data=blank();keys=null;viewing='me';lastShare='';save();toast('모두 지웠어요');render()}}
});
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;goTab(b.dataset.tab)});
$('#gear').addEventListener('click',()=>goTab('settings'));
$('#who').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;userPicked=true;viewing=b.dataset.who;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetDate)closeSheet()});
// phone back button: close the sheet first, then return to the home tab
// a guard entry sits above the first page, so the first back press on the home tab only warns
let guardActive=!!(history.state&&history.state.dul&&history.state.dul!=='base');
try{if(!history.state)history.replaceState({dul:'base'},'')}catch(e){}
// browsers ignore history entries added without a tap, so the guard is (re)added on the next touch
const armGuard=()=>{if(!guardActive&&(!history.state||history.state.dul==='base')){history.pushState({dul:'guard'},'');guardActive=true}};
document.addEventListener('pointerdown',armGuard,true);
document.addEventListener('keydown',armGuard,true);
window.addEventListener('popstate',e=>{
  const st=e.state&&e.state.dul;
  if(!st||st==='base')guardActive=false;
  if(ignorePop){ignorePop=false;return}
  if(sheetDate){closeSheet(true);return}
  if(tab!=='home'){tab='home';render();window.scrollTo(0,0);return}
  if(!guardActive)toast('뒤로가기를 한 번 더 누르면 종료돼요');
});
// swipe the sheet down to close it
(function(){
  const sh=$('#sheet');let y0=null,dy=0;
  sh.addEventListener('touchstart',e=>{const onHead=e.target.closest('.shead');y0=(onHead||sh.scrollTop<=0)?e.touches[0].clientY:null;dy=0},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy>0&&(sh.scrollTop<=0||e.target.closest('.shead'))){sh.style.transition='none';sh.style.transform='translateY('+dy+'px)'}},{passive:true});
  sh.addEventListener('touchend',()=>{if(y0===null)return;sh.style.transition='';if(dy>90)closeSheet();else sh.style.transform='';y0=null;dy=0});
})();
applyTheme();
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
render();
syncInit();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
